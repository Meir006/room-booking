<div th:fragment="userInfo" class="sidePanel">
    <div class="userInfoContainer">
        <div class="userInfo">
            <span>
                Logged in as: <strong th:text="${session.userId}"></strong>
            </span>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" id="logoutButton">Log out</button>
        </form>
    </div>

    <a th:href="@{/}" class="homeButton">Home</a>
</div>
