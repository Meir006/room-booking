<div th:fragment="userInfo" class="userInfoContainer">
    <div class="userInfo">
        <span>
            Logged in as: <strong th:text="${session.userId}"></strong>
        </span>
    </div>

    <form th:action="@{/logout}" method="post">
        <button type="submit" id="logoutButton">Log out</button>
    </form>
</div>
